<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA 3D 풋볼 리얼리티</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background-color: #000; font-family: 'Arial', sans-serif; user-select: none; }
        
        /* 풋볼 스코어보드 UI */
        #scoreboard {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 15, 30, 0.85);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 10px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        .team-score { font-size: 28px; font-weight: 900; }
        .team-name { font-size: 16px; font-weight: bold; letter-spacing: 1px; }
        .red-team { color: #ff4757; }
        .blue-team { color: #1e90ff; }
        .timer { font-size: 20px; color: #f1c40f; font-family: monospace; }

        /* 컨트롤 안내 UI */
        #controls-ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            border-left: 4px solid #1e90ff;
            z-index: 10;
        }

        /* 미니맵 */
        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 180px;
            height: 110px;
            background: rgba(20, 80, 20, 0.8);
            border: 2px solid #fff;
            border-radius: 6px;
            z-index: 10;
        }

        /* 골 알림 메시지 */
        #goal-banner {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 80px;
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 0 0 20px #000, 0 0 40px #ff0000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 100;
        }
        #goal-banner.active { transform: translate(-50%, -50%) scale(1); }
    </style>
    <!-- Three.js 3D 라이브러리 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="scoreboard">
        <span class="team-name red-team">RED DEVILS</span>
        <span id="score-red" class="team-score red-team">0</span>
        <span style="font-size:20px; color:#aaa;">:</span>
        <span id="score-blue" class="team-score blue-team">0</span>
        <span class="team-name blue-team">BLUE FC</span>
        <span id="timer" class="timer">00:00</span>
    </div>

    <div id="controls-ui">
        <b>🎮 피파 3D 조작법 (RED 팀)</b><br>
        • 이동: W, A, S, D / 방향키<br>
        • 패스: J 또는 Z<br>
        • 슈팅: K 또는 X<br>
        • 대시 / 선수변경: Space<br>
    </div>

    <canvas id="minimap"></canvas>
    <div id="goal-banner">GOAL!!!</div>

    <script>
        // --- 1. Three.js 기본 씬 설정 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a2b3c);
        scene.fog = new THREE.FogExp2(0x1a2b3c, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 조명 설정
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 80, 30);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -80;
        dirLight.shadow.camera.right = 80;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        scene.add(dirLight);

        // --- 2. 경기장 (Pitch) 생성 ---
        const PITCH_WIDTH = 120;
        const PITCH_HEIGHT = 80;

        // 잔디 판
        const pitchGeo = new THREE.PlaneGeometry(PITCH_WIDTH, PITCH_HEIGHT);
        const pitchMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.8 });
        const pitch = new THREE.Mesh(pitchGeo, pitchMat);
        pitch.rotation.x = -Math.PI / 2;
        pitch.receiveShadow = true;
        scene.add(pitch);

        // 라인 그리기
        function createFieldLines() {
            const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
            const points = [];
            
            // 외곽선
            const hw = PITCH_WIDTH / 2, hh = PITCH_HEIGHT / 2;
            points.push(new THREE.Vector3(-hw, 0.05, -hh));
            points.push(new THREE.Vector3(hw, 0.05, -hh));
            points.push(new THREE.Vector3(hw, 0.05, hh));
            points.push(new THREE.Vector3(-hw, 0.05, hh));
            points.push(new THREE.Vector3(-hw, 0.05, -hh));
            
            // 중앙선
            points.push(new THREE.Vector3(0, 0.05, -hh));
            points.push(new THREE.Vector3(0, 0.05, hh));

            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const lines = new THREE.Line(lineGeo, lineMat);
            scene.add(lines);

            // 중앙 원
            const circleGeo = new THREE.RingGeometry(9.15, 9.3, 32);
            const circleMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
            const circle = new THREE.Mesh(circleGeo, circleMat);
            circle.rotation.x = Math.PI / 2;
            circle.position.y = 0.05;
            scene.add(circle);
        }
        createFieldLines();

        // 골대 생성
        function createGoal(xPos) {
            const goalGroup = new THREE.Group();
            const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            
            // 기둥 2개 + 상단 바 1개
            const postGeo = new THREE.CylinderGeometry(0.2, 0.2, 5);
            const leftPost = new THREE.Mesh(postGeo, postMat);
            leftPost.position.set(xPos, 2.5, -8);
            
            const rightPost = new THREE.Mesh(postGeo, postMat);
            rightPost.position.set(xPos, 2.5, 8);

            const barGeo = new THREE.CylinderGeometry(0.2, 0.2, 16.4);
            const bar = new THREE.Mesh(barGeo, postMat);
            bar.rotation.x = Math.PI / 2;
            bar.position.set(xPos, 5, 0);

            goalGroup.add(leftPost, rightPost, bar);
            scene.add(goalGroup);
        }
        createGoal(-PITCH_WIDTH / 2);
        createGoal(PITCH_WIDTH / 2);

        // --- 3. 축구공 및 선수 객체 ---
        const ballGeo = new THREE.SphereGeometry(0.8, 16, 16);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.castShadow = true;
        ball.position.set(0, 0.8, 0);
        scene.add(ball);

        let ballVel = new THREE.Vector3(0, 0, 0);

        // 선수 클래스
        class Player {
            constructor(team, isGK = false) {
                this.team = team; // 'red' or 'blue'
                this.isGK = isGK;
                
                // 캐릭터 메쉬 그룹
                this.mesh = new THREE.Group();
                const color = team === 'red' ? 0xff4757 : 0x1e90ff;
                
                // 몸통
                const bodyGeo = new THREE.CylinderGeometry(0.6, 0.6, 2.2);
                const bodyMat = new THREE.MeshStandardMaterial({ color: color });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 1.1;
                body.castShadow = true;
                this.mesh.add(body);

                // 머리
                const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 2.5;
                head.castShadow = true;
                this.mesh.add(head);

                scene.add(this.mesh);

                this.vel = new THREE.Vector3();
                this.speed = 0.25;
                this.hasBall = false;
            }

            setPosition(x, z) {
                this.mesh.position.set(x, 0, z);
            }
        }

        // 선수 배열 생성 (RED: 플레이어 팀, BLUE: AI 팀)
        const redTeam = [];
        const blueTeam = [];

        // RED 팀 위치 배치
        const redPositions = [[-10, 0], [-25, -15], [-25, 15], [-40, -10], [-40, 10]];
        redPositions.forEach(pos => {
            const p = new Player('red');
            p.setPosition(pos[0], pos[1]);
            redTeam.push(p);
        });

        // BLUE 팀 위치 배치
        const bluePositions = [[10, 0], [25, -15], [25, 15], [40, -10], [40, 10]];
        bluePositions.forEach(pos => {
            const p = new Player('blue');
            p.setPosition(pos[0], pos[1]);
            blueTeam.push(p);
        });

        let activePlayer = redTeam[0]; // 현재 플레이어가 조종 중인 선수
        
        // 선택 표시 링
        const ringGeo = new THREE.RingGeometry(1, 1.2, 16);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffff00, side: THREE.DoubleSide });
        const selectRing = new THREE.Mesh(ringGeo, ringMat);
        selectRing.rotation.x = Math.PI / 2;
        selectRing.position.y = 0.08;
        scene.add(selectRing);

        // --- 4. 조작 및 키보드 이벤트 ---
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;

            // 패스 (J 또는 Z)
            if (e.key.toLowerCase() === 'j' || e.key.toLowerCase() === 'z') {
                if (activePlayer.hasBall) passBall();
            }
            // 슛 (K 또는 X)
            if (e.key.toLowerCase() === 'k' || e.key.toLowerCase() === 'x') {
                if (activePlayer.hasBall) shootBall();
            }
            // 선수 변경 (Space - 공을 안 가지고 있을 때)
            if (e.code === 'Space' && !activePlayer.hasBall) {
                switchActivePlayer();
            }
        });
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // 패스 시스템
        function passBall() {
            let closestTeammate = null;
            let minDistance = Infinity;

            redTeam.forEach(p => {
                if (p !== activePlayer) {
                    const dist = activePlayer.mesh.position.distanceTo(p.mesh.position);
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestTeammate = p;
                    }
                }
            });

            if (closestTeammate) {
                activePlayer.hasBall = false;
                const dir = new THREE.Vector3().subVectors(closestTeammate.mesh.position, ball.position).normalize();
                ballVel.copy(dir.multiplyScalar(1.2));
            }
        }

        // 슈팅 시스템
        function shootBall() {
            activePlayer.hasBall = false;
            const goalPos = new THREE.Vector3(PITCH_WIDTH / 2, 1, (Math.random() - 0.5) * 10);
            const dir = new THREE.Vector3().subVectors(goalPos, ball.position).normalize();
            ballVel.copy(dir.multiplyScalar(2.0)); // 강력한 슛
        }

        // 조종 선수 전환
        function switchActivePlayer() {
            let closest = redTeam[0];
            let minDist = Infinity;
            redTeam.forEach(p => {
                const d = p.mesh.position.distanceTo(ball.position);
                if (d < minDist) {
                    minDist = d;
                    closest = p;
                }
            });
            activePlayer = closest;
        }

        // --- 5. 게임 로직 및 AI ---
        let scoreRed = 0, scoreBlue = 0;
        let gameTime = 0;

        function updateAI() {
            // AI(BLUE 팀)는 공을 향해 이동하거나 적절히 공격/수비
            let closestBlue = blueTeam[0];
            let minDist = Infinity;

            blueTeam.forEach(p => {
                const d = p.mesh.position.distanceTo(ball.position);
                if (d < minDist) {
                    minDist = d;
                    closestBlue = p;
                }
            });

            // 가장 가까운 AI가 공을 향해 추격
            const dir = new THREE.Vector3().subVectors(ball.position, closestBlue.mesh.position).normalize();
            closestBlue.mesh.position.add(dir.multiplyScalar(0.18));
            closestBlue.mesh.lookAt(ball.position.x, 0, ball.position.z);

            // AI가 공을 차지했을 때 반대편 골대로 슈팅
            if (closestBlue.hasBall) {
                const goalPos = new THREE.Vector3(-PITCH_WIDTH / 2, 1, 0);
                if (closestBlue.mesh.position.distanceTo(goalPos) < 35) {
                    closestBlue.hasBall = false;
                    const shootDir = new THREE.Vector3().subVectors(goalPos, ball.position).normalize();
                    ballVel.copy(shootDir.multiplyScalar(1.5));
                } else {
                    closestBlue.mesh.position.x -= 0.15; // 골대 쪽으로 드리블
                }
            }
        }

        function checkGoal() {
            const hw = PITCH_WIDTH / 2;
            if (ball.position.x > hw && Math.abs(ball.position.z) < 8) {
                // RED 팀 득점!
                scoreRed++;
                triggerGoal("RED DEVILS GOAL!");
            } else if (ball.position.x < -hw && Math.abs(ball.position.z) < 8) {
                // BLUE 팀 득점!
                scoreBlue++;
                triggerGoal("BLUE FC GOAL!");
            }
        }

        function triggerGoal(text) {
            document.getElementById('score-red').innerText = scoreRed;
            document.getElementById('score-blue').innerText = scoreBlue;

            const banner = document.getElementById('goal-banner');
            banner.innerText = text;
            banner.classList.add('active');

            // 리셋
            ball.position.set(0, 0.8, 0);
            ballVel.set(0, 0, 0);
            redTeam.forEach(p => p.hasBall = false);
            blueTeam.forEach(p => p.hasBall = false);

            setTimeout(() => {
                banner.classList.remove('active');
            }, 2000);
        }

        // --- 6. 미니맵 그리기 ---
        const mapCanvas = document.getElementById('minimap');
        const mapCtx = mapCanvas.getContext('2d');
        mapCanvas.width = 180;
        mapCanvas.height = 110;

        function drawMinimap() {
            mapCtx.clearRect(0, 0, mapCanvas.width, mapCanvas.height);

            const scaleX = mapCanvas.width / PITCH_WIDTH;
            const scaleY = mapCanvas.height / PITCH_HEIGHT;

            // RED 선수
            redTeam.forEach(p => {
                const x = (p.mesh.position.x + PITCH_WIDTH / 2) * scaleX;
                const y = (p.mesh.position.z + PITCH_HEIGHT / 2) * scaleY;
                mapCtx.fillStyle = '#ff4757';
                mapCtx.beginPath();
                mapCtx.arc(x, y, 4, 0, Math.PI * 2);
                mapCtx.fill();
            });

            // BLUE 선수
            blueTeam.forEach(p => {
                const x = (p.mesh.position.x + PITCH_WIDTH / 2) * scaleX;
                const y = (p.mesh.position.z + PITCH_HEIGHT / 2) * scaleY;
                mapCtx.fillStyle = '#1e90ff';
                mapCtx.beginPath();
                mapCtx.arc(x, y, 4, 0, Math.PI * 2);
                mapCtx.fill();
            });

            // 공
            const bx = (ball.position.x + PITCH_WIDTH / 2) * scaleX;
            const by = (ball.position.z + PITCH_HEIGHT / 2) * scaleY;
            mapCtx.fillStyle = '#ffffff';
            mapCtx.beginPath();
            mapCtx.arc(bx, by, 3, 0, Math.PI * 2);
            mapCtx.fill();
        }

        // --- 7. 메인 게임 루프 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            // 1. Player 조작 입력 업데이트
            const moveDir = new THREE.Vector3();
            if (keys['w'] || keys['arrowup']) moveDir.z -= 1;
            if (keys['s'] || keys['arrowdown']) moveDir.z += 1;
            if (keys['a'] || keys['arrowleft']) moveDir.x -= 1;
            if (keys['d'] || keys['arrowright']) moveDir.x += 1;

            if (moveDir.length() > 0) {
                moveDir.normalize();
                const speed = keys[' '] ? 0.4 : activePlayer.speed; // 스페이스바로 대시
                activePlayer.mesh.position.add(moveDir.multiplyScalar(speed));
                activePlayer.mesh.rotation.y = Math.atan2(moveDir.x, moveDir.z);
            }

            // 선택선수 하이라이트 링
            selectRing.position.x = activePlayer.mesh.position.x;
            selectRing.position.z = activePlayer.mesh.position.z;

            // 2. 공 물리 engine 및 소유권 업데이트
            ball.position.add(ballVel);
            ballVel.multiplyScalar(0.95); // 마찰력

            // 공 충돌 판정 (선수가 공 근처에 오면 소유)
            [...redTeam, ...blueTeam].forEach(p => {
                const dist = p.mesh.position.distanceTo(ball.position);
                if (dist < 2.0 && ballVel.length() < 0.5) {
                    p.hasBall = true;
                    // 다른 선수의 공은 뺏김
                    [...redTeam, ...blueTeam].forEach(other => { if (other !== p) other.hasBall = false; });
                }

                if (p.hasBall) {
                    // 선수가 바라보는 전방으로 공 이동
                    const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), p.mesh.rotation.y);
                    ball.position.copy(p.mesh.position).add(forward.multiplyScalar(1.2));
                    ball.position.y = 0.8;
                }
            });

            // 경기장 외곽선 바운드 제한
            const hw = PITCH_WIDTH / 2 - 1, hh = PITCH_HEIGHT / 2 - 1;
            ball.position.x = THREE.MathUtils.clamp(ball.position.x, -hw, hw);
            ball.position.z = THREE.MathUtils.clamp(ball.position.z, -hh, hh);

            // 3. AI 및 경기 판정
            updateAI();
            checkGoal();
            drawMinimap();

            // 4. 피파 스타일 방송 카메라 (공과 선택선수를 추적)
            const camTarget = new THREE.Vector3().addVectors(ball.position, activePlayer.mesh.position).multiplyScalar(0.5);
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, camTarget.x, 0.05);
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, camTarget.z + 35, 0.05);
            camera.position.y = THREE.MathUtils.lerp(camera.position.y, 25, 0.05);
            camera.lookAt(camTarget.x, 0, camTarget.z);

            // 타이머 업데이트
            gameTime += clock.getDelta();
            const mins = Math.floor(gameTime / 60).toString().padStart(2, '0');
            const secs = Math.floor(gameTime % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;

            renderer.render(scene, camera);
        }

        // 창 크기 변경 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 게임 시작
        animate();
    </script>
</body>
</html>
