<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1대1 격투 게임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 1024px;
            height: 576px;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            background: linear-gradient(to bottom, #2b1055, #7597de);
            overflow: hidden;
        }
        /* UI 헤더 */
        .ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .player-ui {
            width: 400px;
        }
        .health-bar-bg {
            background-color: #555;
            height: 30px;
            border: 2px solid #fff;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }
        .health-bar {
            height: 100%;
            width: 100%;
            transition: width 0.1s linear;
        }
        #p1-health { background-color: #ff4757; }
        #p2-health { background-color: #2ed573; }
        
        .skill-container {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .p2-skills { justify-content: flex-end; }
        
        .skill-box {
            width: 50px;
            height: 30px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            position: relative;
        }
        .cooldown-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff4757;
        }

        /* 게임 오버/시작 화면 */
        #message-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        #message-text {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px #000;
        }
        button {
            padding: 12px 24px;
            font-size: 20px;
            font-weight: bold;
            background-color: #eccc68;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s;
        }
        button:hover {
            background-color: #ffa502;
            transform: scale(1.05);
        }
        
        .controls-info {
            margin-top: 15px;
            display: flex;
            gap: 40px;
            background: #222;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        .controls-info div { line-height: 1.6; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- UI (체력바 및 스킬) -->
        <div class="ui-container">
            <!-- Player 1 UI -->
            <div class="player-ui">
                <h3 style="color: #ff4757;">PLAYER 1</h3>
                <div class="health-bar-bg">
                    <div id="p1-health" class="health-bar"></div>
                </div>
                <div class="skill-container">
                    <div class="skill-box">G: 파이어<div id="p1-s1-cd" class="cooldown-overlay" style="display:none;"></div></div>
                    <div class="skill-box">H: 강공격<div id="p1-s2-cd" class="cooldown-overlay" style="display:none;"></div></div>
                </div>
            </div>

            <!-- Player 2 UI -->
            <div class="player-ui" style="text-align: right;">
                <h3 style="color: #2ed573;">PLAYER 2</h3>
                <div class="health-bar-bg">
                    <div id="p2-health" class="health-bar"></div>
                </div>
                <div class="skill-container p2-skills">
                    <div class="skill-box">L: 파이어<div id="p2-s1-cd" class="cooldown-overlay" style="display:none;"></div></div>
                    <div class="skill-box">;: 강공격<div id="p2-s2-cd" class="cooldown-overlay" style="display:none;"></div></div>
                </div>
            </div>
        </div>

        <!-- 캔버스 -->
        <canvas id="gameCanvas" width="1024" height="576"></canvas>

        <!-- 메시지 및 시작 화면 -->
        <div id="message-screen">
            <div id="message-text">1 VS 1 대전 게임</div>
            <button onclick="startGame()">게임 시작</button>
        </div>
    </div>

    <!-- 조작법 안내 -->
    <div class="controls-info">
        <div>
            <b style="color: #ff4757;">Player 1 조작</b><br>
            이동: A, D | 점프: W<br>
            기본 공격: F<br>
            스킬1(파이어볼): G | 스킬2(강공격): H
        </div>
        <div>
            <b style="color: #2ed573;">Player 2 조작</b><br>
            이동: ←, → | 점프: ↑<br>
            기본 공격: K<br>
            스킬1(파이어볼): L | 스킬2(강공격): ;
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const gravity = 0.7;
        let gameRunning = false;
        let animationFrameId;

        // 플레이어 클래스
        class Player {
            constructor({ position, velocity, color, facingLeft = false }) {
                this.initialPosition = { ...position };
                this.position = position;
                this.velocity = velocity;
                this.width = 50;
                this.height = 120;
                this.color = color;
                this.health = 100;
                this.isGrounded = false;
                this.facingLeft = facingLeft;

                // 공격 상태
                this.isAttacking = false;
                this.attackBox = {
                    position: { x: this.position.x, y: this.position.y },
                    width: 100,
                    height: 50
                };
                this.attackDamage = 5;

                // 스킬 쿨타임 (ms)
                this.skill1Cooldown = 0;
                this.skill2Cooldown = 0;
            }

            draw() {
                // 캐릭터 그리기
                ctx.fillStyle = this.color;
                ctx.fillRect(this.position.x, this.position.y, this.width, this.height);

                // 눈 (바라보는 방향 표시)
                ctx.fillStyle = 'white';
                const eyeX = this.facingLeft ? this.position.x + 10 : this.position.x + 30;
                ctx.fillRect(eyeX, this.position.y + 20, 10, 10);

                // 공격 이펙트 (일반 공격 / 강공격)
                if (this.isAttacking) {
                    ctx.fillStyle = this.attackDamage > 10 ? 'gold' : 'white';
                    ctx.fillRect(
                        this.attackBox.position.x, 
                        this.attackBox.position.y, 
                        this.attackBox.width, 
                        this.attackBox.height
                    );
                }
            }

            update() {
                this.draw();

                // 공격 박스 위치 업데이트
                this.attackBox.position.x = this.facingLeft ? 
                    this.position.x - this.attackBox.width + this.width : 
                    this.position.x;
                this.attackBox.position.y = this.position.y + 20;

                // 중력 적용 및 이동
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                // 바닥 충돌 처리
                if (this.position.y + this.height + this.velocity.y >= canvas.height - 50) {
                    this.velocity.y = 0;
                    this.position.y = canvas.height - 50 - this.height;
                    this.isGrounded = true;
                } else {
                    this.velocity.y += gravity;
                    this.isGrounded = false;
                }

                // 벽 충돌 처리
                if (this.position.x < 0) this.position.x = 0;
                if (this.position.x + this.width > canvas.width) this.position.x = canvas.width - this.width;

                // 쿨타임 감소
                if (this.skill1Cooldown > 0) this.skill1Cooldown -= 1000 / 60;
                if (this.skill2Cooldown > 0) this.skill2Cooldown -= 1000 / 60;
            }

            attack() {
                if (this.isAttacking) return;
                this.attackDamage = 7;
                this.attackBox.width = 100;
                this.isAttacking = true;
                setTimeout(() => { this.isAttacking = false; }, 100);
            }

            useSkill1() { // 파이어볼 발사
                if (this.skill1Cooldown > 0) return;
                this.skill1Cooldown = 3000; // 3초 쿨타임

                projectiles.push(new Projectile({
                    position: {
                        x: this.facingLeft ? this.position.x : this.position.x + this.width,
                        y: this.position.y + 30
                    },
                    velocity: {
                        x: this.facingLeft ? -12 : 12,
                        y: 0
                    },
                    color: this.color === '#ff4757' ? '#ff6b81' : '#7bed9f',
                    owner: this
                }));
            }

            useSkill2() { // 강공격 (파워 스트라이크)
                if (this.skill2Cooldown > 0) return;
                this.skill2Cooldown = 5000; // 5초 쿨타임

                this.attackDamage = 25;
                this.attackBox.width = 150;
                this.isAttacking = true;
                
                // 돌진 효과
                this.velocity.x = this.facingLeft ? -15 : 15;

                setTimeout(() => { this.isAttacking = false; }, 200);
            }
        }

        // 투사체 (파이어볼) 클래스
        class Projectile {
            constructor({ position, velocity, color, owner }) {
                this.position = position;
                this.velocity = velocity;
                this.radius = 15;
                this.color = color;
                this.owner = owner;
                this.markedForDeletion = false;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.position.x, this.position.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }

            update() {
                this.draw();
                this.position.x += this.velocity.x;

                // 화면 밖으로 나가면 삭제
                if (this.position.x < 0 || this.position.x > canvas.width) {
                    this.markedForDeletion = true;
                }
            }
        }

        // 객체 생성
        const player1 = new Player({
            position: { x: 100, y: 0 },
            velocity: { x: 0, y: 0 },
            color: '#ff4757',
            facingLeft: false
        });

        const player2 = new Player({
            position: { x: 874, y: 0 },
            velocity: { x: 0, y: 0 },
            color: '#2ed573',
            facingLeft: true
        });

        let projectiles = [];

        // 키 입력 관리
        const keys = {
            a: false, d: false, w: false,
            ArrowLeft: false, ArrowRight: false, ArrowUp: false
        };

        window.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            // Player 1
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;
            if ((e.key === 'w' || e.key === 'W') && player1.isGrounded) player1.velocity.y = -16;
            if (e.key === 'f' || e.key === 'F') player1.attack();
            if (e.key === 'g' || e.key === 'G') player1.useSkill1();
            if (e.key === 'h' || e.key === 'H') player1.useSkill2();

            // Player 2
            if (e.key === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.key === 'ArrowRight') keys.ArrowRight = true;
            if (e.key === 'ArrowUp' && player2.isGrounded) player2.velocity.y = -16;
            if (e.key === 'k' || e.key === 'K') player2.attack();
            if (e.key === 'l' || e.key === 'L') player2.useSkill1();
            if (e.key === ';') player2.useSkill2();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
            if (e.key === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.key === 'ArrowRight') keys.ArrowRight = false;
        });

        // 충돌 판정 함수
        function checkRectCollision(rect1, rect2) {
            return (
                rect1.position.x < rect2.position.x + rect2.width &&
                rect1.position.x + rect1.width > rect2.position.x &&
                rect1.position.y < rect2.position.y + rect2.height &&
                rect1.position.y + rect1.height > rect2.position.y
            );
        }

        // UI 업데이트
        function updateUI() {
            document.getElementById('p1-health').style.width = Math.max(0, player1.health) + '%';
            document.getElementById('p2-health').style.width = Math.max(0, player2.health) + '%';

            // 쿨타임 표시
            const updateCD = (elementId, cdTime) => {
                const el = document.getElementById(elementId);
                if (cdTime > 0) {
                    el.style.display = 'flex';
                    el.innerText = (cdTime / 1000).toFixed(1);
                } else {
                    el.style.display = 'none';
                }
            };

            updateCD('p1-s1-cd', player1.skill1Cooldown);
            updateCD('p1-s2-cd', player1.skill2Cooldown);
            updateCD('p2-s1-cd', player2.skill1Cooldown);
            updateCD('p2-s2-cd', player2.skill2Cooldown);
        }

        // 게임 루프
        function animate() {
            if (!gameRunning) return;

            animationFrameId = requestAnimationFrame(animate);

            // 배경 그리기
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 바닥 그리기
            ctx.fillStyle = '#333';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

            // Player 1 이동
            player1.velocity.x = 0;
            if (keys.a) { player1.velocity.x = -6; player1.facingLeft = true; }
            if (keys.d) { player1.velocity.x = 6; player1.facingLeft = false; }

            // Player 2 이동
            player2.velocity.x = 0;
            if (keys.ArrowLeft) { player2.velocity.x = -6; player2.facingLeft = true; }
            if (keys.ArrowRight) { player2.velocity.x = 6; player2.facingLeft = false; }

            // 업데이트
            player1.update();
            player2.update();

            // 근접 공격 충돌 판정
            if (player1.isAttacking && checkRectCollision(player1.attackBox, player2)) {
                player2.health -= player1.attackDamage;
                player1.isAttacking = false; // 연속 다단히트 방지
            }
            if (player2.isAttacking && checkRectCollision(player2.attackBox, player1)) {
                player1.health -= player2.attackDamage;
                player2.isAttacking = false;
            }

            // 투사체 처리
            projectiles.forEach((p, index) => {
                p.update();

                // 투사체 충돌 (상대방)
                const target = (p.owner === player1) ? player2 : player1;
                const dist = Math.hypot(p.position.x - (target.position.x + target.width/2), p.position.y - (target.position.y + target.height/2));
                
                if (dist < p.radius + target.width/2) {
                    target.health -= 15; // 파이어볼 데미지
                    p.markedForDeletion = true;
                }
            });

            // 화면 밖이나 충돌된 투사체 제거
            projectiles = projectiles.filter(p => !p.markedForDeletion);

            updateUI();

            // 승패 판정
            if (player1.health <= 0 || player2.health <= 0) {
                endGame();
            }
        }

        function startGame() {
            // 초기화
            player1.health = 100;
            player2.health = 100;
            player1.position = { x: 100, y: 0 };
            player2.position = { x: 874, y: 0 };
            player1.skill1Cooldown = 0; player1.skill2Cooldown = 0;
            player2.skill1Cooldown = 0; player2.skill2Cooldown = 0;
            projectiles = [];
            
            document.getElementById('message-screen').style.display = 'none';
            gameRunning = true;
            animate();
        }

        function endGame() {
            gameRunning = false;
            cancelAnimationFrame(animationFrameId);
            
            const msgText = document.getElementById('message-text');
            if (player1.health <= 0 && player2.health <= 0) {
                msgText.innerText = "무승부!";
                msgText.style.color = "white";
            } else if (player1.health <= 0) {
                msgText.innerText = "PLAYER 2 승리!";
                msgText.style.color = "#2ed573";
            } else {
                msgText.innerText = "PLAYER 1 승리!";
                msgText.style.color = "#ff4757";
            }

            document.getElementById('message-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
